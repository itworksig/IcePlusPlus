name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # Liquid Glass is gated on the link SDK, not the run-time OS: building
    # with Xcode <=16 keeps the legacy appearance even on Tahoe, so CI must
    # build with the Xcode 26+ SDK like local builds do. macos-14 runners
    # (Xcode 16 max) are deprecated.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 SDK
        run: |
          ls -d /Applications/Xcode*.app
          PINNED="/Applications/Xcode_26.6.app"
          if [ -d "$PINNED" ]; then
            XCODE="$PINNED"
          else
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "${XCODE:-}" ]; then
            echo "No Xcode 26+ found on runner"
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --show-sdk-version --sdk macosx)"
      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must look like vX.Y.Z (e.g. v0.11.13)"
            exit 1
          fi
          # Sparkle requires the build number to keep increasing and it must
          # stay above 1117 (the last build released upstream).
          BUILD_NUMBER=$((1117 + GITHUB_RUN_NUMBER))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Building version $VERSION ($BUILD_NUMBER)"
      - name: Build app
        run: |
          xcodebuild -project Ice.xcodeproj -scheme Ice -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean build
          BUILD_DIR=$(xcodebuild -project Ice.xcodeproj -scheme Ice -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -showBuildSettings 2>/dev/null \
            | sed -n 's/^ *BUILT_PRODUCTS_DIR *= *//p' | head -1)
          echo "APP_PATH=$BUILD_DIR/Ice.app" >> $GITHUB_ENV
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
      - name: Package Apple silicon zip and disk image
        run: |
          set -euo pipefail
          ARCHES=$(lipo -archs "$APP_PATH/Contents/MacOS/Ice")
          echo "Architectures: $ARCHES"
          if [ "$ARCHES" != "arm64" ]; then
            echo "Expected an Apple silicon (arm64) binary, got: $ARCHES"
            exit 1
          fi
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" Ice.zip
          STAGE=$(mktemp -d)
          ditto "$APP_PATH" "$STAGE/Ice.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Ice" -srcfolder "$STAGE" -ov -format UDZO Ice-arm64.dmg
          rm -rf "$STAGE"
          cat > release.json << EOF
          {
            "version": "$VERSION",
            "build": "$BUILD_NUMBER",
            "arch": "arm64",
            "zip": "Ice.zip",
            "dmg": "Ice-arm64.dmg"
          }
          EOF
          echo "Packaged Ice.zip and Ice-arm64.dmg for $VERSION ($BUILD_NUMBER)"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Ice.zip
            Ice-arm64.dmg
            release.json
          generate_release_notes: true
# Check for Updates compares CFBundleShortVersionString with the tag on
# https://github.com/itworksig/IcePlusPlus/releases/latest
# Asset names must stay Ice.zip and Ice-arm64.dmg (see GitHubUpdates).
# Ad-hoc signing is for this fork's own installs. A Developer ID signature
# is what Gatekeeper wants for a public download.

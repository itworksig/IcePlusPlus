name: Release Apple silicon

# Pushes of vX.Y.Z build an arm64 Ice.app and attach Ice.zip plus
# Ice-arm64.dmg to that GitHub release. The app compares its version with
# https://api.github.com/repos/itworksig/IcePlusPlus/releases/latest
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，例如 v27.0.2。必须高于已安装版本。"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    # Building with the macOS 26 SDK or newer. macos-26 runners are arm64.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            XCODE="/Applications/Xcode_26.6.app"
          else
            XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "${XCODE:-}" ] || [ ! -d "$XCODE" ]; then
            echo "No Xcode 26 or newer found on runner"
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --show-sdk-version --sdk macosx)"
      - name: Derive version from tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must look like vX.Y.Z (e.g. v27.0.2)"
            exit 1
          fi
          # Sparkle requires the build number to keep increasing and it must
          # stay above 1117 (the last build released upstream).
          BUILD_NUMBER=$((1117 + GITHUB_RUN_NUMBER))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Building version $VERSION ($BUILD_NUMBER)"
      - name: Build app
        run: |
          xcodebuild -project Ice.xcodeproj -scheme Ice -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean build
          BUILD_DIR=$(xcodebuild -project Ice.xcodeproj -scheme Ice -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -showBuildSettings 2>/dev/null \
            | sed -n 's/^ *BUILT_PRODUCTS_DIR *= *//p' | head -1)
          echo "APP_PATH=$BUILD_DIR/Ice.app" >> $GITHUB_ENV
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
      - name: Package Apple silicon zip and disk image
        run: |
          set -euo pipefail
          ARCHES=$(lipo -archs "$APP_PATH/Contents/MacOS/Ice")
          echo "Architectures: $ARCHES"
          if [ "$ARCHES" != "arm64" ]; then
            echo "Expected an Apple silicon (arm64) binary, got: $ARCHES"
            exit 1
          fi
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" Ice.zip
          STAGE=$(mktemp -d)
          ditto "$APP_PATH" "$STAGE/Ice.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Ice" -srcfolder "$STAGE" -ov -format UDZO Ice-arm64.dmg
          rm -rf "$STAGE"
          cat > release.json << EOF
          {
            "version": "$VERSION",
            "build": "$BUILD_NUMBER",
            "arch": "arm64",
            "zip": "Ice.zip",
            "dmg": "Ice-arm64.dmg"
          }
          EOF
          echo "Packaged Ice.zip and Ice-arm64.dmg for $VERSION ($BUILD_NUMBER)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            Ice.zip
            Ice-arm64.dmg
            release.json
          generate_release_notes: true
